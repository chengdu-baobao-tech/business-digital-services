<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐私说明｜企业官网预览</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;margin:0;background:#f7f9fc;color:#1d2939}.wrap{max-width:820px;margin:60px auto;padding:0 24px}h1{font-size:38px}.card{background:#fff;border:1px solid #e4e9f0;border-radius:20px;padding:34px;line-height:1.9}a{color:#314bd8}</style></head><body><div class="wrap"><h1>隐私说明</h1><div class="card"><p>本企业官网预览工具用于帮助用户在浏览器中生成企业网站视觉样张。</p><p>默认情况下，用户填写的企业名称、业务介绍、电话、邮箱、地址等信息仅在当前浏览器中处理，不会因为填写表单而自动提交至成都保堡智能科技有限公司服务器。</p><p>分享链接会把用户主动填写的公开文字信息编码在链接片段中。请仅填写愿意公开展示的信息，不要填写身份证号、账户密码、银行卡信息、客户名单、技术图纸或其他敏感内容。</p><p>若用户主动点击联系、咨询正式建站或通过其他渠道提交业务需求，则相应信息按照实际联系渠道处理。</p><p><a href="./">返回生成工具</a> · <a href="../privacy.html">查看公司隐私页面</a></p></div></div></body></html>
