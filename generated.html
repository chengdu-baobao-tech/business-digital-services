<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>企业官网</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:#17243a;background:#fff}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,88%);margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid #e4eaf1}.top .wrap{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-weight:900;font-size:19px}.nav{display:flex;gap:22px;align-items:center;font-size:14px}.nav .upgrade{background:var(--primary);color:#fff;padding:10px 15px;border-radius:10px;font-weight:800}.hero{min-height:650px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:480px;height:480px;border-radius:50%;background:rgba(255,255,255,.08);right:-120px;top:-120px}.hero .wrap{position:relative;z-index:2}.hero small{letter-spacing:.17em;font-weight:800;opacity:.76}.hero h1{font-size:clamp(48px,7vw,86px);line-height:1.03;max-width:950px;margin:18px 0 24px;letter-spacing:-.04em}.hero p{font-size:19px;line-height:1.8;max-width:760px;color:#eef4fb}.hero .cta{display:inline-flex;margin-top:24px;background:#fff;color:var(--primary);padding:14px 22px;border-radius:12px;font-weight:900}.section{padding:90px 0}.eyebrow{font-size:12px;letter-spacing:.17em;font-weight:900;color:var(--primary)}h2{font-size:clamp(34px,4vw,50px);margin:8px 0 14px}.lead{max-width:790px;font-size:17px;line-height:1.85;color:#637188}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:38px}.card{border:1px solid #e1e7ef;border-radius:22px;padding:30px;background:#fff;box-shadow:0 12px 34px rgba(30,48,78,.06)}.card span{display:inline-grid;width:38px;height:38px;border-radius:11px;place-items:center;background:var(--soft);color:var(--primary);font-weight:900}.card h3{font-size:22px;margin:18px 0 8px}.card p{color:#68768a;line-height:1.7}.alt{background:#f7f9fc}.contact{background:#101c30;color:#fff}.contact .lead{color:#cbd5e1}.contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:32px}.contact-grid>div{border:1px solid rgba(255,255,255,.14);border-radius:15px;padding:20px}.contact-grid small{display:block;color:#aebbd0;margin-bottom:6px}.footer{background:#091321;color:#cbd5e1;padding:26px 0}.footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.footer a{color:#fff}.support{font-size:13px;opacity:.9}.freebar{background:#eef4fb;border-bottom:1px solid #dce6f2;padding:10px 0;font-size:13px;color:#56667b}.freebar .wrap{display:flex;justify-content:space-between;gap:16px;align-items:center}.freebar a{font-weight:800;color:#223c62}@media(max-width:760px){.cards,.contact-grid{grid-template-columns:1fr}.nav a:not(.upgrade){display:none}.freebar .wrap{display:block}.hero{min-height:580px}}
</style>
</head>
<body>
<div class="freebar"><div class="wrap"><span>免费生成网站，可长期分享使用。</span><a id="edit" href="./">返回修改</a></div></div>
<header class="top"><div class="wrap"><a class="brand" id="brand" href="#">企业名称</a><nav class="nav"><a href="#about">关于</a><a href="#services">产品服务</a><a href="#contact">联系</a><a class="upgrade" href="../contact.html">定制高级网站</a></nav></div></header>
<main>
<section class="hero"><div class="wrap"><small id="industry">企业服务</small><h1 id="headline">让客户一眼看懂你的企业。</h1><p id="intro">企业介绍</p><a href="#contact" class="cta">立即咨询</a></div></section>
<section id="about" class="section"><div class="wrap"><span class="eyebrow">ABOUT</span><h2>关于我们</h2><p class="lead" id="aboutText"></p></div></section>
<section id="services" class="section alt"><div class="wrap"><span class="eyebrow">PRODUCTS & SERVICES</span><h2>产品与服务</h2><div class="cards"><article class="card"><span>01</span><h3 id="s1"></h3><p>清晰展示企业核心业务、产品和服务内容。</p></article><article class="card"><span>02</span><h3 id="s2"></h3><p>面向真实客户需求提供专业项目支持。</p></article><article class="card"><span>03</span><h3 id="s3"></h3><p>提供稳定、长期、方便联系的服务入口。</p></article></div></div></section>
<section class="section"><div class="wrap"><span class="eyebrow">SERVICE AREA</span><h2>服务区域</h2><p class="lead" id="market"></p></div></section>
<section id="contact" class="section contact"><div class="wrap"><span class="eyebrow" style="color:#9ebee8">CONTACT</span><h2>联系我们</h2><p class="lead">欢迎就产品、服务和合作需求与我们联系。</p><div class="contact-grid" id="contactGrid"></div></div></section>
</main>
<footer class="footer"><div class="wrap"><span id="copyright"></span><span class="support">免费企业官网工具 · <a href="https://china.bb369tech.com/" target="_blank" rel="noopener">成都保堡智能科技有限公司</a></span></div></footer>
<script>
(()=>{const raw=location.hash.startsWith('#site=')?location.hash.slice(6):'';let v={name:'示例企业',industry:'企业服务',headline:'让客户一眼看懂你的企业。',intro:'我们专注于稳定、专业的产品与服务。',s1:'产品与解决方案',s2:'项目定制服务',s3:'长期客户支持',market:'本地及全国客户',phone:'',email:'',address:'',style:'executive'};try{if(raw)v={...v,...JSON.parse(decodeURIComponent(raw))}}catch(e){}const themes={executive:['#142a47','#5278a0','#edf3f9'],industrial:['#22282f','#68737e','#f0f2f4'],luxury:['#4a2e4f','#9b7699','#f6eef6'],global:['#0b5860','#4ba4a2','#e8f6f5']};const t=themes[v.style]||themes.executive;document.documentElement.style.setProperty('--primary',t[0]);document.documentElement.style.setProperty('--secondary',t[1]);document.documentElement.style.setProperty('--soft',t[2]);const T=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val||''};T('brand',v.name);T('industry',v.industry);T('headline',v.headline);T('intro',v.intro);T('aboutText',v.intro);T('s1',v.s1);T('s2',v.s2);T('s3',v.s3);T('market',v.market);T('copyright','© '+new Date().getFullYear()+' '+v.name);document.title=v.name+'｜'+v.industry;document.getElementById('edit').href='./#site='+encodeURIComponent(JSON.stringify(v));const g=document.getElementById('contactGrid');const add=(l,val,href)=>{if(!val)return;const d=document.createElement('div');const s=document.createElement('small');s.textContent=l;const b=document.createElement('strong');if(href){const a=document.createElement('a');a.href=href;a.textContent=val;b.appendChild(a)}else b.textContent=val;d.append(s,b);g.appendChild(d)};add('服务区域',v.market);add('联系电话',v.phone,v.phone?'tel:'+v.phone.replace(/\s+/g,''):'');add('公开邮箱',v.email,v.email?'mailto:'+v.email:'');add('地址 / 服务地点',v.address);if(!g.children.length){const d=document.createElement('div');d.innerHTML='<small>联系信息</small><strong>请通过企业官方渠道联系我们</strong>';g.appendChild(d)}})();
</script>
</body>
</html>
