<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务卡生成器｜保堡智能科技</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#f3f6fb;color:#13213a}.top{height:78px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}.top a{text-decoration:none;color:#1c2b44}.wrap{width:min(1240px,92%);margin:40px auto}.intro h1{font-size:42px;margin:0 0 10px}.intro p{color:#6a788c}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;margin-top:28px}.panel{background:#fff;border:1px solid #e0e7ef;border-radius:22px;padding:28px;box-shadow:0 16px 42px rgba(30,48,78,.07)}label{display:block;font-weight:800;font-size:13px;margin-bottom:15px}input,textarea{width:100%;margin-top:8px;border:1px solid #cfd8e6;border-radius:12px;padding:13px 14px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer;background:#10203a;color:#fff}.btn.alt{background:#fff;color:#10203a;border:1px solid #d8e1ed}.stage{background:linear-gradient(145deg,#eaf1fa,#f8fafc);display:grid;place-items:center;min-height:620px}.card{width:min(620px,94%);aspect-ratio:4/5;border-radius:30px;padding:48px;background:linear-gradient(145deg,#11233e 0%,#244d7e 62%,#5b82aa 100%);color:#fff;box-shadow:0 28px 80px rgba(26,43,71,.28);position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-110px;top:-80px;background:rgba(255,255,255,.08)}.badge{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 11px;font-size:11px;letter-spacing:.14em;font-weight:900}.card h2{font-size:42px;line-height:1.05;margin:28px 0 10px;max-width:480px}.city{font-size:15px;color:#d8e4f1}.services{display:grid;gap:12px;margin:36px 0}.service{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px 18px;font-weight:800}.contact{position:absolute;left:48px;right:48px;bottom:48px;border-top:1px solid rgba(255,255,255,.22);padding-top:20px}.contact small{display:block;color:#d3deeb;margin-bottom:6px}.support{font-size:11px;opacity:.72;margin-top:16px}.support a{color:#fff}@media(max-width:900px){.grid{grid-template-columns:1fr}.card{width:min(580px,94vw)}} 
</style></head><body>
<header class="top"><a href="../index.html">← 返回工具中心</a><strong>保堡智能科技 · 免费商家工具</strong></header>
<main class="wrap"><div class="intro"><h1>高级服务卡生成器</h1><p>生成后可直接保存、截图和转发。适合朋友圈、微信、客户沟通和企业宣传。</p></div>
<div class="grid"><section class="panel">
<label>企业名称<input id="n" placeholder="例如：XX门窗"></label>
<label>主要城市 / 区域<input id="c" placeholder="例如：成都 · 高新区"></label>
<label>服务 1<input id="s1" placeholder="例如：系统门窗"></label>
<label>服务 2<input id="s2" placeholder="例如：阳光房"></label>
<label>服务 3<input id="s3" placeholder="例如：安装与售后"></label>
<label>联系方式<input id="p" placeholder="例如：138 0000 0000"></label>
<label>联系说明<textarea id="d" rows="3" placeholder="例如：欢迎咨询项目报价与现场测量"></textarea></label>
<div class="actions"><button class="btn" id="gen">生成</button><button class="btn alt" id="copy">复制宣传文字</button><button class="btn alt" id="save">保存为图片</button></div>
</section>
<section class="panel stage"><div id="card" class="card"><span class="badge">LOCAL BUSINESS</span><h2 id="pn">你的企业名称</h2><div id="pc" class="city">服务区域</div><div class="services"><div class="service" id="ps1">核心服务 01</div><div class="service" id="ps2">核心服务 02</div><div class="service" id="ps3">核心服务 03</div></div><div class="contact"><small id="pd">欢迎咨询产品与服务</small><strong id="pp">联系电话</strong><div class="support">免费商家工具 · <a href="https://china.bb369tech.com/" target="_blank" rel="noopener">成都保堡智能科技有限公司</a></div></div></div></section></div></main>
<script>
const $=id=>document.getElementById(id);function render(){pn.textContent=n.value||'你的企业名称';pc.textContent=c.value||'服务区域';ps1.textContent=s1.value||'核心服务 01';ps2.textContent=s2.value||'核心服务 02';ps3.textContent=s3.value||'核心服务 03';pp.textContent=p.value||'联系电话';pd.textContent=d.value||'欢迎咨询产品与服务'}document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',render));gen.onclick=render;copy.onclick=async()=>{const t=`${n.value||'企业名称'}\n${c.value||''}\n${s1.value||''}｜${s2.value||''}｜${s3.value||''}\n${d.value||''}\n${p.value||''}`;try{await navigator.clipboard.writeText(t);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制宣传文字',1200)}catch(e){prompt('复制以下内容',t)}};save.onclick=()=>{window.print()};render();
</script></body></html>
