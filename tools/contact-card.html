<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/site.css"><title>企业联系卡片生成器｜保堡智能科技</title></head><body><header class="topbar"><a class="brand" href="../"><span class="mark">B</span><span><b>保堡智能科技</b><small>免费商家工具</small></span></a><nav><a href="../#tools">全部工具</a><a class="btn" href="../#builder">生成官网</a></nav></header><main><section class="shell section"><div class="heading"><span class="eyebrow">FREE TOOL</span><h1>企业联系卡片生成器</h1><p>把公开联系信息整理成可直接放在官网、公众号或资料中的联系卡。</p></div><div class="builder"><form class="panel" id="toolForm"><label>企业名称<input id="n"></label><label>电话<input id="p"></label><label>邮箱<input id="e"></label><label>地址 / 服务区域<input id="a"></label><label>网站<input id="w" placeholder="https://"></label><div class="actions"><button class="btn" type="submit">生成</button><button class="btn ghost" id="copy" type="button">复制结果</button></div><p class="note">请只填写愿意公开使用的企业信息。</p></form><div class="panel"><h3>生成结果</h3><div id="result" style="white-space:pre-wrap;background:#f7f9fc;padding:20px;border-radius:12px;min-height:240px"></div></div></div></section></main><script>document.getElementById('toolForm').onsubmit=e=>{e.preventDefault();let g=id=>document.getElementById(id).value.trim();document.getElementById('result').innerText=`${g('n')}
电话：${g('p')}
邮箱：${g('e')}
地址 / 服务区域：${g('a')}
官方网站：${g('w')}`};document.getElementById('copy').onclick=async()=>{let t=document.getElementById('result').innerText;try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='已复制'}catch(e){prompt('复制结果',t)}};</script><footer class="site-footer"><div class="shell"><b>成都保堡智能科技有限公司</b><span>免费商家工具 · 内容默认在浏览器本地处理</span><nav><a href="../privacy.html">隐私说明</a><a href="../">返回</a></nav></div></footer></body></html>
