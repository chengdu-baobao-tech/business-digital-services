<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联系卡生成器</title><style>body{margin:0;background:#f4f7fb;font-family:Arial,"Microsoft YaHei",sans-serif;color:#12203a}.wrap{width:min(1000px,92%);margin:40px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.box{background:#fff;border:1px solid #e0e7f0;border-radius:22px;padding:28px}label{display:block;margin:14px 0;font-weight:700}input{width:100%;margin-top:7px;padding:12px;border:1px solid #d0dae7;border-radius:10px}.card{min-height:430px;background:linear-gradient(145deg,#11223d,#325a87);color:#fff;border-radius:26px;padding:38px;display:flex;flex-direction:column;justify-content:space-between}.card h2{font-size:34px;margin:0}.line{font-size:18px;margin:10px 0}.support{font-size:12px;opacity:.75}.back{color:#28436a;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="back" href="../index.html">← 返回工具中心</a><h1>企业联系卡生成器</h1><div class="grid"><section class="box"><label>企业名称<input id="n"></label><label>联系人<input id="p"></label><label>电话<input id="t"></label><label>邮箱<input id="e"></label><label>地址<input id="a"></label></section><section><div class="card"><div><small>BUSINESS CONTACT</small><h2 id="pn">企业名称</h2><div class="line" id="pp">联系人</div></div><div><div class="line" id="pt">电话</div><div class="line" id="pe">邮箱</div><div class="line" id="pa">地址</div><div class="support">免费商家工具 · 成都保堡智能科技有限公司</div></div></div></section></div></main><script>const x=id=>document.getElementById(id);function r(){pn.textContent=n.value||'企业名称';pp.textContent=p.value||'联系人';pt.textContent=t.value||'电话';pe.textContent=e.value||'邮箱';pa.textContent=a.value||'地址'}document.querySelectorAll('input').forEach(i=>i.oninput=r);r()</script></body></html>
