<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业介绍生成器</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#15213a}.wrap{width:min(1000px,92%);margin:40px auto}.box{background:#fff;border:1px solid #e0e6ef;border-radius:20px;padding:28px;margin-top:20px}label{display:block;margin:14px 0;font-weight:700}input,textarea{width:100%;padding:12px;border:1px solid #d0d9e5;border-radius:10px;margin-top:7px;font:inherit}.btn{background:#10203a;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800}.result{line-height:1.9;color:#405069;white-space:pre-wrap}.back{color:#2a4368;text-decoration:none}</style></head><body><main class="wrap"><a class="back" href="../index.html">← 返回工具中心</a><h1>企业介绍生成器</h1><div class="box"><label>企业名称<input id="n"></label><label>主营业务<input id="b"></label><label>主要客户<input id="c"></label><label>服务地区<input id="r"></label><button class="btn" id="g">生成介绍</button></div><div class="box"><h2>生成结果</h2><div id="o" class="result"></div></div></main><script>g.onclick=()=>{o.textContent=`${n.value||'本公司'}专注于${b.value||'相关产品与服务'}，主要服务${c.value||'企业及客户'}。业务覆盖${r.value||'相关地区'}。我们重视真实业务展示、清晰沟通和长期客户服务，欢迎就产品、项目与合作需求进一步联系。`}</script></body></html>
