<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/site.css"><title>服务区域卡片｜保堡智能科技</title></head><body><header class="topbar"><a class="brand" href="../"><span class="mark">B</span><span><b>保堡智能科技</b><small>免费商家工具</small></span></a><nav><a href="../#tools">全部工具</a><a class="btn" href="../#builder">生成官网</a></nav></header><main><section class="shell section"><div class="heading"><span class="eyebrow">FREE TOOL</span><h1>服务区域卡片</h1><p>快速整理企业服务区域，适合官网和商家介绍。</p></div><div class="builder"><form class="panel" id="toolForm"><label>企业名称<input id="n"></label><label>主要城市 / 区域<input id="a" placeholder="例如：成都、郫都、双流"></label><label>服务类型<input id="s" placeholder="例如：上门安装、维修、项目服务"></label><label>联系说明<input id="c" placeholder="例如：具体服务范围请提前咨询"></label><div class="actions"><button class="btn" type="submit">生成</button><button class="btn ghost" id="copy" type="button">复制结果</button></div><p class="note">请只填写愿意公开使用的企业信息。</p></form><div class="panel"><h3>生成结果</h3><div id="result" style="white-space:pre-wrap;background:#f7f9fc;padding:20px;border-radius:12px;min-height:240px"></div></div></div></section></main><script>document.getElementById('toolForm').onsubmit=e=>{e.preventDefault();let g=id=>document.getElementById(id).value.trim();document.getElementById('result').innerText=`${g('n')}
服务区域：${g('a')}
服务内容：${g('s')}
${g('c')}`};document.getElementById('copy').onclick=async()=>{let t=document.getElementById('result').innerText;try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='已复制'}catch(e){prompt('复制结果',t)}};</script><footer class="site-footer"><div class="shell"><b>成都保堡智能科技有限公司</b><span>免费商家工具 · 内容默认在浏览器本地处理</span><nav><a href="../privacy.html">隐私说明</a><a href="../">返回</a></nav></div></footer></body></html>
