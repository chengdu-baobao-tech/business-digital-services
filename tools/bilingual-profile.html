<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/site.css"><title>双语简介助手｜保堡智能科技</title></head><body><header class="topbar"><a class="brand" href="../"><span class="mark">B</span><span><b>保堡智能科技</b><small>免费商家工具</small></span></a><nav><a href="../#tools">全部工具</a><a class="btn" href="../#builder">生成官网</a></nav></header><main><section class="shell section"><div class="heading"><span class="eyebrow">FREE TOOL</span><h1>双语简介助手</h1><p>生成一个可继续人工校对的中英文企业简介基础模板。</p></div><div class="builder"><form class="panel" id="toolForm"><label>企业名称<input id="n" placeholder="Company name"></label><label>主营业务（中文）<input id="b" placeholder="例如：企业网站建设"></label><label>英文业务名称<input id="be" placeholder="e.g. Business Website Development"></label><label>服务区域<input id="a" placeholder="例如：成都 / Chengdu"></label><div class="actions"><button class="btn" type="submit">生成</button><button class="btn ghost" id="copy" type="button">复制结果</button></div><p class="note">请只填写愿意公开使用的企业信息。</p></form><div class="panel"><h3>生成结果</h3><div id="result" style="white-space:pre-wrap;background:#f7f9fc;padding:20px;border-radius:12px;min-height:240px"></div></div></div></section></main><script>document.getElementById('toolForm').onsubmit=e=>{e.preventDefault();let n=document.getElementById('n').value||'本公司',b=document.getElementById('b').value||'企业服务',be=document.getElementById('be').value||'business services',a=document.getElementById('a').value||'本地及相关市场';document.getElementById('result').innerText=`中文：
${n}提供${b}，服务于${a}的企业与客户。欢迎通过官方渠道了解更多产品、服务与合作信息。

English:
${n} provides ${be} for businesses and customers in ${a}. Please contact us through our official business channels for product, service and cooperation information.`};document.getElementById('copy').onclick=async()=>{let t=document.getElementById('result').innerText;try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='已复制'}catch(e){prompt('复制结果',t)}};</script><footer class="site-footer"><div class="shell"><b>成都保堡智能科技有限公司</b><span>免费商家工具 · 内容默认在浏览器本地处理</span><nav><a href="../privacy.html">隐私说明</a><a href="../">返回</a></nav></div></footer></body></html>
